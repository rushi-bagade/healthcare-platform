spring.application.name=encounter-service
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/encounter_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Appointment Service
services.appointment.base-url=http://localhost:8082

services.fhir.base-url=http://localhost:8085



