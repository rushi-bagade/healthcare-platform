# Copy the following values into application.properties and update your password.
spring.application.name=encounter-service
server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/encounter_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
services.appointment.base-url=http://localhost:8082
management.endpoints.web.exposure.include=health,info,metrics,threaddump
management.endpoint.health.show-details=always
spring.jackson.serialization.write-dates-as-timestamps=false
